<!DOCTYPE html>
<html>
<head>
    <title>Daily Carbon Input</title>
</head>
<body>

<h2>Enter Today's Activities</h2>

<form method="POST">
    {% csrf_token %}

    <label>Travel (km):</label>
    <input type="number" step="0.1" name="travel_km" required><br><br>

    <label>Electricity (kWh):</label>
    <input type="number" step="0.1" name="electricity_kwh" required><br><br>

    <label>Meals:</label>
    <input type="number" name="meals" required><br><br>

    <label>Waste (kg):</label>
    <input type="number" step="0.1" name="waste_kg" required><br><br>

    <button type="submit">Calculate Carbon</button>
</form>

</body>
</html>
